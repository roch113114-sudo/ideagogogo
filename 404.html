<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>IDEAGOGOGO</title>
  <script>
    // 将路径重定向到根路径，保留 hash
    var path = window.location.pathname;
    var hash = window.location.hash;
    if (path !== '/' && !path.startsWith('/#/')) {
      window.location.replace('/#' + path + hash);
    } else {
      window.location.replace('/');
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
